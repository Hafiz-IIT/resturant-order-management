name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name "*.js" -not -path "./.git/*" -print0 | xargs -0 -n1 node --check
